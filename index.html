<!doctype html>

<title>Condutas AVAC — Dimensionamento</title>
<style>
:root{--navy:#1F3864;--org:#ED7D31;--bg:#eef1f6;--card:#fff;--line:#d5dbe7;--txt:#1b2433;--mut:#5b6678;--red:#C00000;--blue:#DDEBF7;--crit:#FCE4D6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--txt);background:var(--bg);font-size:15px}
button,select,input,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:6px 12px;flex-wrap:wrap}
header .t{font-weight:bold;font-size:17px;white-space:nowrap}
header .eq{font-size:12px;opacity:.85}
header select{background:#fff;color:#1b2433;border:0;border-radius:6px;padding:7px 8px;min-height:38px;max-width:180px}
nav{display:flex;gap:4px;margin-left:auto}
nav button,.btn{background:#2d4a82;color:#fff;border:0;border-radius:8px;padding:9px 14px;min-height:40px;cursor:pointer}
nav button.on{background:#fff;color:var(--navy);font-weight:bold}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.org{background:var(--org)}
.btn.red{background:var(--red)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
main{flex:1;min-height:0;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding:10px;display:none}
.view.on{display:block}
#v-rede.on{display:flex;gap:10px;flex-direction:column}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;flex:none}
.k{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:8px;padding:6px 10px;min-width:0}
.k.e{border-left-color:var(--org)}.k.e b{color:var(--org)}
.k span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase}
.k b{font-size:21px;color:var(--navy)}.k i{font-style:normal;font-size:11px;color:var(--mut)}
.split{display:flex;gap:10px;flex:1;min-height:0}
.pane{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;min-height:0}
#tree{flex:0 0 42%;display:flex;flex-direction:column}
#treeList{flex:1;overflow:auto}
#edit{flex:1;padding:10px 14px}
.trow{display:flex;align-items:center;gap:6px;padding:7px 8px;border-bottom:1px solid #edf0f5;cursor:pointer;min-height:46px}
.trow.sel{background:#e3ecfb;outline:2px solid var(--navy);outline-offset:-2px}
.trow.crit .nm{color:#b4530c;font-weight:bold}
.trow .id{font-weight:bold;min-width:28px}
.trow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .r{font-size:12px;color:var(--mut);text-align:right;white-space:nowrap}
.trow .al{color:var(--red);font-weight:bold}
.trow .er{color:#fff;background:var(--red);border-radius:4px;padding:1px 5px;font-size:11px}
.tb{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);flex-wrap:wrap;background:#f8f9fc}
h3{margin:10px 0 6px;font-size:12px;text-transform:uppercase;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
label.f{display:block;font-size:11px;color:var(--mut)}
label.f input,label.f select{display:block;width:100%;margin-top:2px;padding:8px;border:1px solid #b9c3d6;border-radius:6px;background:#fffbe6;min-height:38px;color:#0000cc}
label.f select{background:#fffbe6}
label.f input[readonly]{background:#f1f3f7;color:var(--txt)}
.step{display:flex;align-items:center;gap:4px;margin-top:2px}
.step button{width:40px;height:38px;border:1px solid #b9c3d6;border-radius:6px;background:#fff;font-size:20px}
.step span{min-width:26px;text-align:center;font-weight:bold;font-size:16px}
.res{background:#f4f7fc;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.res div span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase}.res div b{font-size:15px}
.bad{color:var(--red)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{background:var(--navy);color:#fff;font-weight:normal;padding:5px;font-size:11px}
table.t td{border-bottom:1px solid #e6eaf2;padding:3px 5px;text-align:center}
table.t td input,table.t td select{width:100%;border:1px solid #c4cde0;border-radius:4px;padding:5px;background:#fffbe6;color:#0000cc;min-height:30px}
table.t td.l{text-align:left}
.cmp td,.cmp th{padding:4px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.hint{font-size:12px;color:var(--mut)}
#schemaWrap{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;height:100%}
.node{cursor:pointer}
/* ---- folha A4 ---- */
#pageHost{transform-origin:top left}
.page{width:297mm;height:210mm;background:#fff;padding:6mm 9mm;position:relative;overflow:hidden;margin:0 0 10px 0;box-shadow:0 1px 6px #0003;font-size:8pt;page-break-after:always;break-after:page}
.page *{font-family:Arial,Helvetica,sans-serif}
.ban{background:var(--navy);color:#fff;display:grid;grid-template-columns:1fr 90mm;padding:2mm 4mm;border-radius:1mm}

.ban .big{font-size:20pt;font-weight:bold;line-height:1.15}
.ban .sv{font-size:8.5pt;color:#ddebf7}
.ban .meta{font-size:7.5pt;display:grid;grid-template-columns:auto 1fr;gap:.6mm 3mm;align-content:center}
.ban .meta i{font-style:normal;color:#b4c7e7;font-size:6.2pt;font-weight:bold}
.ttl{display:flex;align-items:center;justify-content:space-between;margin:1.5mm 0}
.ttl h1{margin:0;font-size:12pt;color:var(--navy)}
.pk{display:grid;grid-template-columns:repeat(6,1fr);gap:2mm;margin:1.5mm 0}
.pk div{border-left:1.2mm solid var(--navy);background:#f7f9fc;padding:1mm 2mm;border-top:.2mm solid #d5dbe7;border-bottom:.2mm solid #d5dbe7}
.pk div.e{border-left-color:var(--org)}.pk div.e b{color:var(--org)}
.pk span{display:block;font-size:5.6pt;color:#555;font-weight:bold;text-transform:uppercase}.pk b{font-size:14pt;color:var(--navy)}.pk i{font-style:normal;font-size:6pt;color:#555;display:block}

.two{display:grid;grid-template-columns:1fr 80mm;gap:5mm}
.crit-l{display:grid;grid-template-columns:1fr auto;gap:0 3mm;font-size:7pt}
.crit-l div{border-bottom:.15mm solid #bbb;padding:.9mm 0}.crit-l div:nth-child(even){text-align:right;font-weight:bold}
.pt{width:100%;border-collapse:collapse;font-size:6.6pt}
.pt th{background:var(--navy);color:#fff;font-weight:normal;padding:.9mm;font-size:6pt}
.pt td{border-bottom:.15mm solid #bbb;padding:.35mm 1mm;text-align:center}
.pt td.l{text-align:left}.pt tr.c td{background:#FCE4D6}.pt td.w{color:var(--red);font-weight:bold}
.pf{position:absolute;left:9mm;right:9mm;bottom:2.5mm;font-size:6pt;color:#666;display:flex;justify-content:space-between}

.cover{display:grid;grid-template-columns:250px 1fr;height:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.cv-menu{background:#16294d;color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:6px}
.cv-menu h2{margin:0 0 10px;font-size:20px;font-weight:normal}
.cv-menu button{background:transparent;color:#fff;border:0;text-align:left;padding:12px 12px;border-radius:8px;font-size:15px;min-height:44px;cursor:pointer;border-left:4px solid transparent}
.cv-menu button:hover,.cv-menu button:active{background:#2d4a82}
.cv-menu button.go{background:var(--org);font-weight:bold;margin-bottom:10px;border-left-color:transparent}
.cv-menu hr{border:0;border-top:1px solid #ffffff30;margin:8px 0;width:100%}
.cv-menu .hint{color:#b4c7e7;margin-top:auto}
.cv-main{display:flex;flex-direction:column;min-width:0;overflow:auto}
.cv-hero{position:relative;flex:none;height:42%;min-height:190px;background:#1F3864}
.cv-hero svg{width:100%;height:100%;display:block}
.cv-body{padding:16px 26px;display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:start}
.logo-slot{width:190px;height:100px;border:2px dashed #b9c3d6;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:12px;cursor:pointer;background:#f7f9fc;overflow:hidden;padding:6px}
.logo-slot img{max-width:100%;max-height:100%;object-fit:contain}
.cv-title>input{width:100%;border:0;border-bottom:2px solid var(--navy);font-size:26px;font-weight:bold;color:var(--navy);padding:4px 0;background:transparent;outline:0}
.cv-title>input.sub{font-size:15px;font-weight:normal;color:var(--mut);border-bottom:1px solid var(--line);margin-top:6px}
.cv-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:12px}
@media (max-width:760px){.cover{grid-template-columns:1fr;height:auto}.cv-body{grid-template-columns:1fr}}
@media print{
 @page{size:297mm 210mm;margin:0}
 html,body{background:#fff;height:auto}
 #app>header,#app>main>.view:not(#v-resumo),.noprint{display:none!important}
 #app,main{display:block;height:auto;overflow:visible}
 #v-resumo{position:static!important;display:block!important;overflow:visible;padding:0}
 #pageHost{transform:none!important;width:auto!important;height:auto!important}
 .page{margin:0;box-shadow:none}
}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.split{flex-direction:column}#tree{flex:none;max-height:45%}}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:10}
.modal.on{display:flex}.modal>div{background:#fff;border-radius:12px;padding:16px;max-width:560px;width:92%;max-height:86%;overflow:auto}

<body>
<div id="app">
<header>
  <div><div class="t">Condutas AVAC</div><div class="eq" id="hdrEq"></div></div>
  <select id="selCirc" class="ctl" title="Circuito"></select>
  <select id="selMet" class="ctl" title="Método global"></select>
  <nav id="nav"></nav>
</header>
<main>
  <section class="view on" id="v-ficheiro"></section>
  <section class="view" id="v-rede">
    <div class="kpis" id="kpis"></div>
    <div class="split">
      <div class="pane" id="tree"><div id="treeList"></div><div class="tb" id="treeTb"></div></div>
      <div class="pane" id="edit"></div>

    <div class="noprint" style="display:flex;gap:8px;margin-bottom:8px;align-items:center"><button class="btn org" id="btnPrint">🖨 Imprimir / Guardar PDF</button><span class="hint">A4 horizontal. No diálogo de impressão escolha «Guardar como PDF», margens «Nenhuma» e desligue «Cabeçalhos e rodapés».</span></div>
    <div id="pageHost"></div>
  </section>

</main>
</div>
<div class="modal" id="dlgNovo"><div></div></div>

<input type="file" id="logoIn" accept="image/*" style="display:none">

<script>/* Motor de cálculo de condutas AVAC — port do modelo validado (Python) da folha R4.
   Sem dependências. Usado no navegador (window.Engine) e em Node (module.exports). */
(function (root) {
  "use strict";
  const METODOS = ["Perda const.", "Velocidade", "Rec. estática", "Pressões eq."];
  const CODE = { "Perda const.": "PC", "Velocidade": "VL", "Rec. estática": "RE", "Pressões eq.": "PE" };

  function haal(re, eps, d) {
    if (re < 2300) return 64 / re;
    const x = Math.pow((eps / 1000) / d / 3.7, 1.11) + 6.9 / re;
    const l = -1.8 * Math.log10(x);
    return 1 / (l * l);
  }
  const huebscher = (a, b) => 1.3 * Math.pow(a * b, 0.625) / Math.pow(a + b, 0.25);
  const isNum = (x) => typeof x === "number" && isFinite(x);
  const N = (x) => (isNum(x) ? x : 0);

  class Engine {
    constructor(data) {
      this.d = data;
      const p = (this.p = data.params);
      this.rho = p.rho; this.nu = p.visc;
      this.cat = {}; (data.catalogo || []).forEach((c) => (this.cat[c.cod] = c));
      this.mat = {}; (data.materiais || []).forEach((m) => (this.mat[m.nome] = m.eps));
      this.crit = {}; (data.criterios || []).forEach((c) => (this.crit[c.nome] = c));
      this.TAB = (data.diametros || []).map(Number).filter((x) => x > 0).sort((a, b) => a - b);
      this.W = []; for (let i = 0; i < 60; i++) this.W.push(p.ladoMin + i * p.modulo);
      const der = (data.derivacoes || []).filter((r) => isNum(r.q) && isNum(r.c));
      // linhas contíguas a partir do início (como a folha: sem linhas vazias)
      this.der = [];
      for (const r of data.derivacoes || []) { if (isNum(r.q) && isNum(r.c)) this.der.push([r.q, r.c]); else break; }
      let ok = this.der.length >= 2; for (let i = 1; i < this.der.length; i++) if (this.der[i][0] <= this.der[i - 1][0]) ok = false;
      this.derOn = ok;
      this.prepare();
    }

    cval(code) { const c = this.cat[code]; return c ? N(c.valor) : 0; }

    prepare() {
      const d = this.d, p = this.p;
      const rows = d.trechos;
      this.errors = {};
      const byId = new Map(); const cnt = {};
      rows.forEach((t) => { cnt[t.id] = (cnt[t.id] || 0) + 1; if (!byId.has(t.id)) byId.set(t.id, t); });
      this.byId = byId;
      const circNames = (d.circuitos || []).map((c) => c.nome).filter(Boolean);
      this.circNames = circNames;
      // filhos (todas as linhas), folhas
      const kids = new Map(); rows.forEach((t) => kids.set(t.id, []));
      rows.forEach((t) => { if (t.mont !== 0 && kids.has(t.mont)) kids.get(t.mont).push(t); });
      this.kids = kids;
      // caudais (de baixo para cima; evita ciclos)
      const q = new Map();
      const calcQ = (t, seen) => {
        if (q.has(t.id)) return q.get(t.id);
        if (seen.has(t.id)) return 0;
        seen.add(t.id);
        const ks = kids.get(t.id) || [];
        const v = ks.length === 0 ? N(t.qterm) : ks.reduce((s, c) => s + calcQ(c, seen), 0);
        q.set(t.id, v); return v;
      };
      rows.forEach((t) => calcQ(t, new Set()));
      // ordem topológica a partir das raízes (validade do montante)
      const order = []; const seen = new Set();
      const walk = (t) => { if (seen.has(t.id)) return; seen.add(t.id); order.push(t); (kids.get(t.id) || []).forEach(walk); };
      rows.filter((t) => t.mont === 0).forEach(walk);
      this.reached = seen;
      const bad = new Set();
      this.tr = [];
      rows.forEach((t) => {
        let e = "";
        const leaf = (kids.get(t.id) || []).length === 0;
        const par = t.mont === 0 ? null : byId.get(t.mont);
        const catEff = leaf ? "Terminal" : t.cat;
        const eps = this.mat[t.mat];
        const cr = this.crit[p.espaco];
        if (t.id === "" || t.id == null || !isNum(Number(t.id))) e = "ID inválido";
        else if (cnt[t.id] > 1) e = "ID duplicado";
        else if (!circNames.includes(t.circ)) e = "Circuito inválido";
        else if (t.mont !== 0 && (!par || !seen.has(t.id))) e = "Montante inválido";
        else if (par && par.circ !== t.circ) e = "Circuito ≠ montante";
        else if (eps === undefined) e = "Material inválido";
        else if (!leaf && t.cat !== "Tronco" && t.cat !== "Ramal") e = "Categoria inválida";
        else if (!(q.get(t.id) > 0)) e = "Sem caudal";
        else if (!isNum(t.len)) e = "Sem comprimento";
        else if (t.forma === "Retangular" && N(t.manA) > 0 && !(N(t.manB) > 0)) e = "Lado B manual em falta";
        else if (!cr) e = "Tipo de espaço inválido";
        if (e) bad.add(t.id);
        const o = { src: t, id: t.id, mont: t.mont, circ: t.circ, leaf, cat: t.cat, catEff, q: q.get(t.id) || 0, err: e, ok: !e };
        this.tr.push(o);
        if (e) this.errors[t.id] = e;
      });
      // propagar: descendente de inválido por montante inválido (já tratado via seen/par)
      this.idx = new Map(this.tr.map((o, i) => [o.id, o]));
      // ordem de cálculo = topológica restrita a válidos
      this.ord = order.map((t) => this.idx.get(t.id)).filter((o) => o && o.ok && (o.mont === 0 || (this.idx.get(o.mont) && this.idx.get(o.mont).ok)));
      const okSet = new Set(this.ord.map((o) => o.id));
      this.ord.forEach((o) => { if (o.mont !== 0 && !okSet.has(o.mont)) { o.ok = false; o.err = "Montante inválido"; this.errors[o.id] = o.err; } });
      this.ord = this.ord.filter((o) => o.ok);
      this.children = new Map(); this.ord.forEach((o) => this.children.set(o.id, []));
      this.ord.forEach((o) => { if (o.mont !== 0 && this.children.has(o.mont)) this.children.get(o.mont).push(o.id); });
      const lim = this.crit[p.espaco];
      this.ord.forEach((o) => {
        const t = o.src;
        o.qs = o.q / 3600; o.len = t.len; o.eps = this.mat[t.mat];
        o.geo = t.forma === "Retangular" ? "Retangular" : "Circular";
        o.vlim = o.catEff === "Tronco" ? lim.tronco : o.catEff === "Ramal" ? lim.ramal : lim.term;
        o.hfix = N(t.hfix); o.kasp = N(t.kasp) >= 1 ? t.kasp : p.kAlvo;
        o.man = N(t.manA) > 0 ? (o.geo === "Retangular" ? (N(t.manB) > 0 ? [t.manA, t.manB] : null) : [t.manA, null]) : null;
        const qk = (this.d.quick || []);
        let sc = 0, scu = 0, fix = 0, fixu = 0;
        const addPiece = (cod, qtd, valor, ambito) => {
          const c = this.cat[cod]; if (!c || !(qtd > 0)) return;
          const val = (valor !== "" && valor != null && isNum(Number(valor))) ? Number(valor) : N(c.valor);
          const amb = ambito || c.ambito || "Rede";
          if (c.tipo === "C") { sc += qtd * val; if (amb === "UTA") scu += qtd * val; }
          else { fix += qtd * val; if (amb === "UTA") fixu += qtd * val; }
        };
        (t.pecas || []).forEach((pc) => addPiece(pc.cod, N(pc.qtd), pc.valor, pc.ambito));
        // peças rápidas
        o.nder = (this.derOn && N(t.nte) > 0 && t.mont !== 0) ? N(t.nte) : 0;
        sc += N(t.n90) * this.cval(qk[0]) + N(t.n45) * this.cval(qk[1]) + (N(t.nte) - o.nder) * this.cval(qk[2]) + N(t.nred) * this.cval(qk[3]) + N(t.nreg) * this.cval(qk[4]);
        // terminal / equipamento
        if (t.term) {
          const c = this.cat[t.term];
          if (c) {
            if (c.tipo === "C") sc += N(c.valor);
            else {
              const qn = N(c.qnom), ex = N(c.exp) > 0 ? N(c.exp) : 2;
              fix += N(c.valor) * (qn > 0 ? Math.pow(o.q / qn, ex) : 1);
            }
          }
        }
        o.sc = sc; o.scu = scu; o.fix = fix; o.fixu = fixu;
      });
      // Δp/m de referência por circuito
      this.rref = {};
      (d.circuitos || []).forEach((c) => {
        if (!c.nome) return;
        const mine = this.ord.filter((o) => o.circ === c.nome);
        if (!mine.length) return;
        const q0 = mine.filter((o) => o.mont === 0).reduce((s, o) => s + o.q, 0);
        const d0 = Math.sqrt(4 * (q0 / 3600) / (Math.PI * p.vini));
        const re0 = p.vini * d0 / this.nu;
        const eps0 = mine[0].eps;
        const derived = haal(re0, eps0, d0) / d0 * this.rho / 2 * p.vini * p.vini;
        this.rref[c.nome] = N(c.refIn) > 0 ? c.refIn : derived;
        c._q0 = q0; c._d0 = d0 * 1000; c._re0 = re0; c._eps0 = eps0; c._ref = this.rref[c.nome];
      });
      this._cache = {};
    }

    swamee(o) {
      const g = this.rref[o.circ] / this.rho, q = o.qs, nu = this.nu;

/* ---------------- esquema (SVG) ---------------- */
function schemaSVG(compact) {
  if (!E) return "<p>Sem dados.</p>";
  const res = E.run("AD");
  const nodes = E.ord.filter((o) => o.circ === S.circ);
  if (!nodes.length) return "<p class='hint'>Sem trechos válidos neste circuito.</p>";
  const kids = new Map(); nodes.forEach((o) => kids.set(o.id, []));
  const roots = [];
  nodes.forEach((o) => { if (o.mont === 0 || !kids.has(o.mont)) roots.push(o); else kids.get(o.mont).push(o); });
  const W = compact ? 104 : 168, H = compact ? 24 : 44, GAP = compact ? 18 : 34, PITCH = H + (compact ? 6 : 14), FS = compact ? 7.2 : 12;
  let row = 0, maxLvl = 0; const pos = new Map();
  const place = (o, lvl) => {
    maxLvl = Math.max(maxLvl, lvl); const ks = kids.get(o.id);
    let y;
    if (!ks.length) { y = row++; } else { ks.forEach((c) => place(c, lvl + 1)); const ys = ks.map((c) => pos.get(c.id).y); y = Math.round((Math.min(...ys) + Math.max(...ys)) / 2); }
    pos.set(o.id, { lvl, y });
  };
  roots.forEach((r) => place(r, 0));
  const w = (maxLvl + 1) * W + maxLvl * GAP + 4, hh = row * PITCH + 4;
  const X = (l) => 2 + l * (W + GAP), Y = (y) => 2 + y * PITCH;
  let dark = "", org = "", boxes = "";
  const LW = compact ? 2 : 3;
  nodes.forEach((o) => {
    const p = pos.get(o.id), r = res.get(o.id), ks = kids.get(o.id);
    const x = X(p.lvl), yb = Y(p.y) + H;
    if (ks.length) {
      const xm = x + W + GAP / 2;
      const ys = ks.map((c) => Y(pos.get(c.id).y) + H).concat(yb);
      const seg = (cls, x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${LW}"/>`;
      const critKid = ks.find((c) => res.get(c.id).crit);
      dark += seg("", x + W, yb, xm, yb) + seg("", xm, Math.min(...ys), xm, Math.max(...ys));
      ks.forEach((c) => { dark += seg("", xm, Y(pos.get(c.id).y) + H, X(pos.get(c.id).lvl), Y(pos.get(c.id).y) + H); });
      if (critKid) {
        const yc = Y(pos.get(critKid.id).y) + H;
        org += seg("", x + W, yb, xm, yb) + seg("", xm, Math.min(yb, yc), xm, Math.max(yb, yc)) + seg("", xm, yc, X(pos.get(critKid.id).lvl), yc);
      }
    }
    const fill = r.crit ? "#FCE4D6" : o.leaf ? "#DDEBF7" : "none";
    const col = r.al !== "OK" ? "#C00000" : "#1b2433";
    const t1 = `#${o.id} ${(o.src.desc || (o.leaf ? "Terminal" : o.src.cat))}`.slice(0, compact ? 20 : 26);
    const lines = compact ? [t1, `${r.dim} · ${fmt(r.v, 1)} m/s · Σ${fmt(r.T, 0)}`] : [t1, `${r.dim} · ${fmt(r.v, 1)} m/s`, `${fmt(o.q, 0)} m³/h · Σ${fmt(r.T, 0)} Pa`];
    const txt = lines.map((l, i) => `<text x="${x + 3}" y="${Y(p.y) + (compact ? 9 : 12) + i * (FS + (compact ? 1.5 : 2.5))}" font-size="${FS}" fill="${col}" ${i === 0 ? 'font-weight="bold"' : ""}>${esc(l)}</text>`).join("");
    boxes += `<g class="node" data-id="${o.id}"><rect x="${x}" y="${Y(p.y)}" width="${W}" height="${H}" fill="${fill}" stroke="none"/>${txt}</g>`;
    const ul = `<line x1="${x}" y1="${yb}" x2="${x + W}" y2="${yb}" stroke-width="${LW}"/>`;
    if (r.crit) org += ul; else dark += ul;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${hh}" width="${compact ? "100%" : w}" ${compact ? 'preserveAspectRatio="xMinYMin meet" style="max-height:64mm"' : ""} font-family="Arial,Helvetica,sans-serif"><g stroke="#404040" stroke-linecap="butt">${dark}</g><g stroke="#ED7D31" stroke-linecap="butt">${org}</g>${boxes}</svg>`;
}

    field("Fator da v limite", inText(pr, "fatorV", { num: true, after })), field("Rel. aspeto alvo", inText(pr, "kAlvo", { num: true, after })), field("Rel. aspeto máximo", inText(pr, "kMax", { num: true, after })),

    field("Temperatura (°C)", inText(pr, "temp", { num: true, after: save })), field("Altitude (m)", inText(pr, "alt", { num: true, after: save }))),
    h("div", { style: "margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap" }, h("button", { class: "btn sm ghost", onclick: () => {
      const T = pr.temp + 273.15, rho = 101325 * Math.pow(1 - 2.25577e-5 * pr.alt, 5.25588) / (287.058 * T);
      pr.rho = Math.round(rho * 1e4) / 1e4; pr.visc = Number((1.716e-5 * Math.pow(T / 273.15, 1.5) * (273.15 + 110.4) / (T + 110.4) / rho).toPrecision(4)); changed(false); renderDef();
    } }, "Sugerir ρ e ν a partir de T e altitude"), h("span", { class: "hint" }, "Não corrige a perda de carga por altitude/temperatura além de ρ e ν.")));
  card("Circuitos (ventilador)", tableEditor(d.circuitos, [{ k: "nome", l: "Nome" }, { k: "fugas", l: "Fugas (%)", num: true }, { k: "margem", l: "Margem pressão (%)", num: true }, { k: "rend", l: "Rendimento (0-1)", num: true }, { k: "dpAdic", l: "ΔP adicional (Pa)", num: true }, { k: "refIn", l: "Δp/m ref. (0 = derivar)", num: true }],
    { wrapRow: (c) => pctProxy(pctProxy(c, "fugas"), "margem"), add: () => ({ nome: "Novo circuito", fugas: 0, margem: 0.1, rend: 0.6, dpAdic: 0, refIn: 0 }) }),

  card("Peças rápidas (código do Catálogo)", h("div", { class: "grid" }, ["Curva 90°", "Curva 45°", "Tê / derivação", "Redução", "Registo"].map((l, i) => field(l, inSel(d.quick, i, d.catalogo.map((c) => ({ v: c.cod, l: `${c.cod} (C=${c.valor})` })), { after })))));
  card("Derivações com caudais (opcional)", h("p", { class: "hint" }, "Preencher ≥ 2 linhas, com razões Qb/Qc CRESCENTES e sem linhas vazias, para ativar. C referido à pressão dinâmica do troço comum a montante (ASHRAE). Cada unidade de «Tês / derivações» num trecho com montante passa a usar esta tabela; vazia ⇒ usa o C fixo da peça rápida «Tê». Dados do fabricante ou da base ASHRAE Duct Fitting Database (nenhum valor é fornecido por defeito)."),
    h("p", { class: "hint", id: "derState" }, ""), tableEditor(d.derivacoes, [{ k: "q", l: "Qb / Qc", num: true, nullable: true }, { k: "c", l: "C (ref. troço comum)", num: true, nullable: true }], { del: false }));
  const ds = $("#derState"); if (ds) ds.textContent = E ? (E.derOn ? `ATIVA (${E.der.length} pontos)` : E.der.length ? "INVÁLIDA (razões não crescentes ou < 2 pontos)" : "vazia: C fixo") : "";
  card("Catálogo de singularidades e equipamentos", h("p", { class: "hint" }, "Valores INDICATIVOS. Tipo C: perda = C·ρ/2·v². Tipo Pa: perda por unidade, escala com o caudal se indicar Q nominal: ΔP = Valor·(Q/Qnom)^n (n = 2 por defeito). Âmbito UTA entra na perda TOTAL mas não na EXTERNA."),
    tableEditor(d.catalogo, [{ k: "cod", l: "Código" }, { k: "desc", l: "Descrição" }, { k: "tipo", l: "Tipo", sel: ["C", "Pa"] }, { k: "valor", l: "Valor", num: true }, { k: "qnom", l: "Q nom.", num: true }, { k: "exp", l: "n", num: true }, { k: "ambito", l: "Âmbito", sel: ["Rede", "UTA"] }], { add: () => ({ cod: "NOVO", desc: "", tipo: "C", valor: 0, nota: "", qnom: 0, exp: 0, ambito: "Rede" }) }));
  card("Critérios de velocidade máxima (m/s)", tableEditor(d.criterios, [{ k: "nome", l: "Tipo de espaço" }, { k: "tronco", l: "Tronco", num: true }, { k: "ramal", l: "Ramal", num: true }, { k: "term", l: "Terminal", num: true }, { k: "nc", l: "NC" }], { del: false }));
  card("Materiais (rugosidade ε, mm)", tableEditor(d.materiais, [{ k: "nome", l: "Material" }, { k: "eps", l: "ε (mm)", num: true }], { add: () => ({ nome: "Novo", eps: 0.15, nota: "" }) }));
  const dm = h("input", { type: "text", value: d.diametros.join(", ") }); dm.addEventListener("change", () => { d.diametros = dm.value.split(/[,;\s]+/).map(Number).filter((x) => x > 0); changed(false); });
  card("Diâmetros comerciais (mm)", field("Lista separada por vírgulas, ordem crescente", dm));

/* ---------------- ficheiros ---------------- */
function download(name, text, type) { const a = h("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name }); document.body.append(a); a.click(); a.remove(); }
const CSVH = ["id", "descricao", "montante", "circuito", "categoria", "caudal_terminal", "comprimento", "material", "forma", "altura_fixa", "rel_aspeto", "metodo", "man_A", "man_B", "curvas90", "curvas45", "tes", "reducoes", "registos", "terminal"];
const CSVK = ["id", "desc", "mont", "circ", "cat", "qterm", "len", "mat", "forma", "hfix", "kasp", "metodo", "manA", "manB", "n90", "n45", "nte", "nred", "nreg", "term"];
function csvOut() {
  const q = (v) => { v = v == null ? "" : typeof v === "number" ? String(v).replace(".", ",") : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [CSVH.join(";")].concat(S.data.trechos.map((t) => CSVK.map((k) => q(t[k])).join(";")));
  download("trechos_" + (S.data.projeto.equipamento || "rede").replace(/\W+/g, "_") + ".csv", "﻿" + lines.join("\r\n"), "text/csv");
}
function csvIn(text) {
  text = text.replace(/^﻿/, ""); const sep = text.split("\n")[0].includes(";") ? ";" : ",";
  const rows = []; let cur = [], f = "", inq = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i]; if (inq) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else inq = false; } else f += ch; } else if (ch === '"') inq = true; else if (ch === sep) { cur.push(f); f = ""; } else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; cur.push(f); rows.push(cur); cur = []; f = ""; } else f += ch; }
  if (f !== "" || cur.length) { cur.push(f); rows.push(cur); }
  const head = rows.shift().map((x) => x.trim().toLowerCase());
  const out = [];
  rows.filter((r) => r.some((x) => x.trim() !== "")).forEach((r) => {
    const t = newTrecho({}); t.pecas = [];
    CSVH.forEach((hn, i) => { const j = head.indexOf(hn); if (j < 0) return; const k = CSVK[i], v = (r[j] || "").trim(); const num = ["id", "mont", "qterm", "len", "hfix", "kasp", "manA", "manB", "n90", "n45", "nte", "nred", "nreg"].includes(k); t[k] = num ? (parseNum(v) ?? 0) : v; });
    if (!t.forma) t.forma = "Circular"; out.push(t);
  });
  if (!out.length) { alert("Nenhum trecho encontrado no CSV."); return; }
  if (!confirm(`Substituir os ${S.data.trechos.length} trechos atuais por ${out.length} trechos importados?`)) return;
  S.data.trechos = out;
  const names = new Set(S.data.circuitos.map((c) => c.nome)); out.forEach((t) => { if (t.circ && !names.has(t.circ)) { S.data.circuitos.push({ nome: t.circ, fugas: 0, margem: 0.1, rend: 0.6, dpAdic: 0, refIn: 0 }); names.add(t.circ); } });
  S.circ = out[0].circ || S.circ; S.sel = out[0].id; changed(true); renderHeader();
}

function renderFicheiro() {
  const el = $("#v-ficheiro"); el.innerHTML = ""; const p = S.data.projeto;
  const after = () => { renderHeader(); save(); };
  const mbtn = (txt, fn, cls) => h("button", { class: cls || "", onclick: fn }, txt);
  const menu = h("div", { class: "cv-menu" }, h("h2", {}, "Ficheiro"),
    mbtn("Abrir a rede  ▸", () => setView("rede"), "go"),
    mbtn("Novo projeto (exemplo)", () => { if (confirm("Substituir o projeto atual pelo exemplo?")) { S.data = clone(window.DEFAULT_DATA); migrate(); S.circ = S.data.circuitos[0].nome; S.sel = 1; changed(true); renderFicheiro(); } }),
    mbtn("Abrir projeto (.json)", () => { window.__fileMode("json"); $("#fileIn").accept = ".json,application/json"; $("#fileIn").click(); }),
    mbtn("Guardar projeto (.json)", () => download((p.equipamento || "projeto").replace(/\W+/g, "_") + ".condutas.json", JSON.stringify(S.data, null, 1), "application/json")),
    h("hr"),
    mbtn("Exportar trechos (.csv)", () => csvOut()),
    mbtn("Importar trechos (.csv)", () => { window.__fileMode("csv"); $("#fileIn").accept = ".csv,text/csv,text/plain"; $("#fileIn").click(); }),
    h("hr"),
    window.__pwaPrompt ? mbtn("Instalar no dispositivo", async () => { const e = window.__pwaPrompt; window.__pwaPrompt = null; e.prompt(); await e.userChoice; renderFicheiro(); }, "go") : null,
    mbtn("Resumo A4 / PDF", () => setView("resumo")),
    h("p", { class: "hint" }, "Os dados ficam guardados automaticamente neste dispositivo. Use «Guardar projeto» para cópias de segurança e para levar para o PC."));
  const slot = h("div", { class: "logo-slot", title: "Inserir logotipo", onclick: () => $("#logoIn").click() }, p.logo ? h("img", { src: p.logo }) : h("span", {}, "Logotipo", h("br"), "toque para inserir"));
  const logoBox = h("div", {}, slot, p.logo ? h("button", { class: "btn sm ghost", style: "margin-top:6px", onclick: () => { p.logo = ""; changed(false); renderFicheiro(); } }, "Remover logotipo") : null);
  const tin = (k, cls, ph) => { const i = h("input", { type: "text", class: cls || "", value: p[k] || "", placeholder: ph || "" }); i.addEventListener("change", () => { p[k] = i.value; after(); }); return i; };
  const body = h("div", { class: "cv-body" }, logoBox,
    h("div", { class: "cv-title" }, tin("titulo", "", "Título da folha"), tin("obra", "sub", "Obra / subtítulo"),
      h("div", { class: "cv-fields" }, field("Autor", inText(p, "autor", { after })), field("Versão / revisão", inText(p, "revisao", { after })), field("Data", inText(p, "data", { after })), field("Equipamento", inText(p, "equipamento", { after })), field("Modelo / fabricante", inText(p, "modelo", { after })), field("Requerente", inText(p, "requerente", { after })), field("Local", inText(p, "local", { after })), field("Zona / serviço", inText(p, "zona", { after })), field("Processo n.º", inText(p, "processo", { after })))));
  el.append(h("div", { class: "cover" }, menu, h("div", { class: "cv-main" }, h("div", { class: "cv-hero", html: heroSVG() }), body)));
}
function setLogo(f) {
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => { const m = 400, k = Math.min(1, m / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); S.data.projeto.logo = c.toDataURL("image/png"); changed(false); renderFicheiro(); }; im.src = rd.result; };
  rd.readAsDataURL(f);
}

function renderView() { if (S.view === "ficheiro") renderFicheiro(); else if (S.view === "esquema") renderEsquema(); else if (S.view === "resumo") renderResumo(); else if (S.view === "def") renderDef(); }
function setView(v) {
  S.view = v; document.querySelectorAll(".view").forEach((e) => e.classList.remove("on")); $("#v-" + v).classList.add("on");
  renderHeader(); document.querySelectorAll("header .ctl").forEach((e) => (e.style.display = v === "ficheiro" ? "none" : "")); if (v === "rede") { renderKpis(); renderTree(); renderEdit(); } else renderView();
}
function init() {
  load(); recalc();
  $("#selCirc").addEventListener("change", (e) => { S.circ = e.target.value; const o = ordered(); S.sel = o.length ? o[0].t.id : null; changed(true); });
  $("#selMet").addEventListener("change", (e) => { S.data.params.metodoGlobal = e.target.value; changed(true); });
  $("#btnPrint").onclick = () => window.print();
  let mode = "json"; window.__fileMode = (m) => { mode = m; };
  $("#fileIn").addEventListener("change", (e) => {
    const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { try { if (mode === "json") { S.data = JSON.parse(rd.result); migrate(); S.circ = S.data.circuitos[0].nome; S.sel = S.data.trechos[0] && S.data.trechos[0].id; changed(true); renderHeader(); } else csvIn(rd.result); } catch (err) { alert("Ficheiro inválido: " + err.message); }  e.target.value = ""; };
    rd.readAsText(f);
  });
  window.addEventListener("resize", () => { if (S.view === "resumo") fitPage(); });
  window.addEventListener("beforeprint", () => { const h_ = $("#pageHost"); h_.dataset.t = h_.style.transform; });
  $("#logoIn").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) setLogo(f); e.target.value = ""; });
  setView("ficheiro");
}
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.__pwaPrompt = e; if (S.view === "ficheiro") renderFicheiro(); });
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
init();
window.__app = { S, get E() { return E; }, recalc, changed, setView };
